name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Official releases checked 2026-11-04; pin immutable commit IDs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check tracked publication content (current tree only)
        run: python3 scripts/verify_publication.py
      - name: Rebuild catalog and GitHub pages
        run: |
          python3 library/src/build.py
          python3 scripts/build_catalog.py
          python3 scripts/build_rankings.py
      - name: Verify provenance, denominators, images and local links
        run: python3 scripts/verify_repo.py
      - name: Check that committed Markdown is current
        run: git diff --exit-code -- '*.md'
